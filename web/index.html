<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rulego · 规则管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚙️</span>
      <h1>rulego 规则管理</h1>
      <span class="subtitle">可视化规则引擎 · Blockly 拖拽 · Lua 执行 · JSON 存储</span>
    </div>
    <div class="actions">
      <button id="btn-new" class="btn btn-primary">＋ 新建规则</button>
      <button id="btn-import" class="btn">📥 导入</button>
      <button id="btn-export" class="btn">📤 导出全部</button>
      <button id="btn-refresh" class="btn">🔄 刷新</button>
      <input id="file-import" type="file" accept=".json,application/json" hidden />
    </div>
  </header>

  <main class="manage-layout">
    <!-- 统计卡片 -->
    <section class="stats">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">规则总数</div>
      </div>
      <div class="stat-card on">
        <div class="stat-num" id="stat-enabled">0</div>
        <div class="stat-label">已启用</div>
      </div>
      <div class="stat-card off">
        <div class="stat-num" id="stat-disabled">0</div>
        <div class="stat-label">已停用</div>
      </div>
    </section>

    <!-- 规则列表 -->
    <section class="rule-table-card">
      <div class="table-toolbar">
        <div class="filters">
          <button class="btn filter active" data-filter="all">全部</button>
          <button class="btn filter" data-filter="enabled">已启用</button>
          <button class="btn filter" data-filter="disabled">已停用</button>
        </div>
        <span id="list-count" class="list-count"></span>
      </div>
      <table class="rule-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>ID</th>
            <th>触发事件</th>
            <th>版本</th>
            <th>引擎版本</th>
            <th>状态</th>
            <th>更新时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="rule-tbody">
          <tr><td colspan="8" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="js/rules.js"></script>
  <div id="toast"></div>
</body>
</html>
