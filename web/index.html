<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rulego · 规则管理</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚙️</span>
      <h1>rulego 规则管理</h1>
      <span class="subtitle">可视化规则引擎 · Blockly 拖拽 · Lua 执行 · JSON 存储</span>
    </div>
    <div class="actions">
      <button id="btn-new" class="btn btn-primary">＋ 新建规则</button>
      <button id="btn-import" class="btn">📥 导入</button>
      <button id="btn-export" class="btn">📤 导出全部</button>
      <button id="btn-refresh" class="btn">🔄 刷新</button>
      <input id="file-import" type="file" accept=".json,application/json" hidden />
    </div>
  </header>

  <main class="manage-layout">
    <!-- 统计卡片 -->
    <section class="stats">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">规则总数</div>
      </div>
      <div class="stat-card on">
        <div class="stat-num" id="stat-enabled">0</div>
        <div class="stat-label">已启用</div>
      </div>
      <div class="stat-card off">
        <div class="stat-num" id="stat-disabled">0</div>
        <div class="stat-label">已停用</div>
      </div>
    </section>

    <!-- 规则列表 -->
    <section class="rule-table-card">
      <div class="table-toolbar">
        <div class="filters">
          <button class="btn filter active" data-filter="all">全部</button>
          <button class="btn filter" data-filter="enabled">已启用</button>
          <button class="btn filter" data-filter="disabled">已停用</button>
        </div>
        <span id="list-count" class="list-count"></span>
      </div>
      <table class="rule-table">
        <thead>
          <tr>
            <th>名称</th>
            <th>ID</th>
            <th>触发事件</th>
            <th>版本</th>
            <th>引擎版本</th>
            <th>状态</th>
            <th>更新时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="rule-tbody">
          <tr><td colspan="8" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- 版本历史弹窗 -->
  <div id="version-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="version-modal-title">版本历史</h2>
        <button class="btn modal-close" data-close="version-modal">✕</button>
      </div>
      <div class="modal-body">
        <!-- JSON diff 比对 -->
        <div class="diff-toolbar">
          <span class="diff-label">版本比对</span>
          <select id="diff-v1"></select>
          <span class="diff-arrow">→</span>
          <select id="diff-v2"></select>
          <button id="btn-diff" class="btn btn-sm">比对差异</button>
        </div>
        <div id="diff-result" class="diff-result" hidden>
          <div class="diff-summary" id="diff-summary"></div>
          <table class="diff-table">
            <thead><tr><th>操作</th><th>路径</th><th>值</th></tr></thead>
            <tbody id="diff-tbody"></tbody>
          </table>
        </div>
        <!-- 版本列表 -->
        <table class="rule-table">
          <thead>
            <tr><th>版本</th><th>保存时间</th><th>大小</th><th>操作</th></tr>
          </thead>
          <tbody id="version-tbody">
            <tr><td colspan="4" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JSON 查看/编辑弹窗 -->
  <div id="json-modal" class="modal-overlay" hidden>
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="json-modal-title">规则 JSON</h2>
        <button class="btn modal-close" data-close="json-modal">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="json-editor" class="code-area tall" spellcheck="false"
          placeholder="规则 JSON 内容…（可编辑，保存后写入后端）"></textarea>
      </div>
      <div class="modal-footer">
        <button id="btn-json-save" class="btn btn-primary">💾 保存 JSON</button>
        <button id="btn-json-download" class="btn">⬇ 下载</button>
        <button class="btn modal-close" data-close="json-modal">取消</button>
      </div>
    </div>
  </div>

  <script src="js/rules.js"></script>
  <div id="toast"></div>
</body>
</html>
